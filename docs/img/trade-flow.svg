<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="300" fill="#0b0f17"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8aa0c8"/></marker></defs>
<text x="20" y="28" fill="#e8eefc" font-size="18" font-weight="bold">Real trade: the agent signs, never the server</text>
<rect x="20" y="100" width="150" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="95.0" y="131.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">1. build_trade</text>
<text x="95.0" y="149.0" fill="#8aa0c8" text-anchor="middle" font-size="12">side, coin, amount</text>
<rect x="200" y="100" width="150" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="275.0" y="131.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">2. Checks</text>
<text x="275.0" y="149.0" fill="#8aa0c8" text-anchor="middle" font-size="12">linked wallet, allowlist, caps</text>
<rect x="380" y="100" width="150" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="455.0" y="131.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">3. Jupiter quote</text>
<text x="455.0" y="149.0" fill="#8aa0c8" text-anchor="middle" font-size="12">simulate swap + fee</text>
<rect x="560" y="100" width="150" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="635.0" y="131.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">4. Unsigned tx</text>
<text x="635.0" y="149.0" fill="#8aa0c8" text-anchor="middle" font-size="12">returned to agent</text>
<rect x="740" y="100" width="140" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="810.0" y="131.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">5. Agent signs</text>
<text x="810.0" y="149.0" fill="#8aa0c8" text-anchor="middle" font-size="12">own key, submits</text>
<line x1="170" y1="135" x2="200" y2="135" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="350" y1="135" x2="380" y2="135" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="135" x2="560" y2="135" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="135" x2="740" y2="135" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<rect x="560" y="210" width="150" height="60" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="635.0" y="236.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">6. report_trade</text>
<text x="635.0" y="254.0" fill="#8aa0c8" text-anchor="middle" font-size="12">digest recorded</text>
<line x1="810" y1="170" x2="650" y2="210" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="260" fill="#8aa0c8" font-size="12">Private keys never reach the server. Linking a wallet sends only an ed25519 signature over nimbros-link:&lt;agent id&gt;.</text>
</svg>
