<text x="345.0" y="146.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">Cron worker</text>
<text x="345.0" y="164.0" fill="#8aa0c8" text-anchor="middle" font-size="12">every 4 min, writes KV</text>
<rect x="510" y="70" width="150" height="60" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="585.0" y="96.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">KV: FEEDS</text>
<text x="585.0" y="114.0" fill="#8aa0c8" text-anchor="middle" font-size="12">feed:snipe / feed:scalp</text>
