<line x1="430" y1="150" x2="510" y2="200" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="660" y1="100" x2="730" y2="135" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="660" y1="200" x2="730" y2="165" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="290" fill="#8aa0c8" text-anchor="middle">Browser, CLI and agents read through Pages Functions only. Upstream failures fall back to the last KV copy.</text>
