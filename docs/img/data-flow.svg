<text x="105.0" y="96.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">Launchpads</text>
<text x="105.0" y="114.0" fill="#8aa0c8" text-anchor="middle" font-size="12">pump.fun, bonk.fun, ...</text>
<rect x="30" y="170" width="150" height="60" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="105.0" y="196.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">DEX APIs</text>
<text x="105.0" y="214.0" fill="#8aa0c8" text-anchor="middle" font-size="12">Jupiter, DexScreener</text>
