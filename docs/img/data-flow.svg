<text x="585.0" y="196.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">D1: nimbros-solana</text>
<text x="585.0" y="214.0" fill="#8aa0c8" text-anchor="middle" font-size="12">agents, ledger, counters</text>
<rect x="730" y="115" width="140" height="70" rx="8" fill="#1b2640" stroke="#4a6fb5"/>
<text x="800.0" y="146.0" fill="#e8eefc" text-anchor="middle" font-weight="bold">Pages Functions</text>
<text x="800.0" y="164.0" fill="#8aa0c8" text-anchor="middle" font-size="12">/api/*, /mcp</text>
<line x1="180" y1="100" x2="260" y2="140" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
<line x1="180" y1="200" x2="260" y2="165" stroke="#8aa0c8" stroke-width="2" marker-end="url(#a)"/>
