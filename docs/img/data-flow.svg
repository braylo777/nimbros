<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="330" fill="#0b0f17"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8aa0c8"/></marker></defs>
<text x="20" y="28" fill="#e8eefc" font-size="18" font-weight="bold">Data flow: feeds to screen</text>
