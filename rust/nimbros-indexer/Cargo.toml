[package]
name = "nimbros-indexer"
version = "0.1.0"
edition.workspace = true
description = "Reads Cetus swap events straight from Sui, turns them into per-pool trades and 1s/1m candles, and serves them over HTTP. Replaces third-party price feeds."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
